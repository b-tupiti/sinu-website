<!-- @dsCard group="Website" viewport="1440x900" subtitle="Interactive click-through — nav, filters, tabs, dialog all work" name="SINU website" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SINU website — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="image-slot.js"></script>
<style>
body{margin:0;background:var(--bg-page)}#root{min-height:100vh}
/* Empty-state caption of full-bleed slots is pinned to a corner so it can never
   collide with centered hero/banner copy. */
image-slot::part(empty){align-items:flex-end;justify-content:flex-end;padding:22px 26px;text-align:right;gap:4px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const FILES=[
 '../../components/actions/Button.jsx','../../components/actions/IconButton.jsx',
 '../../components/forms/Input.jsx','../../components/forms/Select.jsx','../../components/forms/Checkbox.jsx','../../components/forms/Radio.jsx','../../components/forms/Switch.jsx','../../components/forms/SearchBar.jsx',
 '../../components/navigation/Tabs.jsx','../../components/navigation/Breadcrumb.jsx','../../components/navigation/Pagination.jsx',
 '../../components/feedback/Badge.jsx','../../components/feedback/Tag.jsx','../../components/feedback/Toast.jsx','../../components/feedback/Tooltip.jsx','../../components/feedback/Dialog.jsx',
 '../../components/surfaces/Card.jsx','../../components/surfaces/StatBlock.jsx',
 '../../components/catalog/CourseCard.jsx','../../components/catalog/ProgramCard.jsx','../../components/catalog/EventCard.jsx','../../components/catalog/PersonCard.jsx',
 'SiteHeader.jsx','SiteFooter.jsx','Homepage.jsx','Catalog.jsx','CourseDetail.jsx','Program.jsx','Admissions.jsx','EventsNews.jsx','Directory.jsx'];
const APP=`
function App(){
  const [page,setPageRaw]=React.useState('home');
  const [dark,setDark]=React.useState(false);
  const nav=p=>{setPageRaw(p);window.scrollTo(0,0);};
  React.useEffect(()=>{document.documentElement.setAttribute('data-theme',dark?'dark':'light');},[dark]);
  const SCREENS={home:Homepage,catalog:Catalog,course:CourseDetail,program:Program,admissions:Admissions,events:EventsNews,directory:Directory};
  const S=SCREENS[page]||Homepage;
  return <React.Fragment>
    <S nav={nav}/>
    <button onClick={()=>setDark(d=>!d)} title="Toggle theme"
      style={{position:'fixed',bottom:20,right:20,zIndex:200,width:44,height:44,borderRadius:'50%',border:'1px solid var(--line-strong)',background:'var(--surface-card)',color:'var(--text-body)',cursor:'pointer',boxShadow:'var(--sh-2)',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">{dark?<circle cx="12" cy="12" r="5"/>:<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>}{dark&&<path d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>}</svg>
    </button>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);`;
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error('404 '+f);return r.text();})))
.then(srcs=>{
  const code=srcs.join('\n')
    .replace(/^import[^\n]*$/gm,'')
    .replace(/^export /gm,'');
  const js=Babel.transform(code+'\n'+APP,{presets:[['react',{runtime:'classic'}]],filename:'app.jsx'}).code;
  new Function('React','ReactDOM',js)(React,ReactDOM);
})
.catch(e=>{document.getElementById('root').innerHTML='<pre style="padding:24px;color:#b3362e">'+e.message+'</pre>';});
</script>
</body>
</html>
