<!-- @dsCard group="Colors" viewport="700x150" subtitle="Status pairs — solid + tint" name="Semantic colors" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-body);display:flex;align-items:center;min-height:130px;padding:16px 20px;box-sizing:border-box}</style></head><body><div style="display:flex;gap:12px;width:100%"><div style="flex:1"><div style="display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line-1)"><div style="flex:1;height:64px;background:var(--success)"></div><div style="flex:1;height:64px;background:var(--success-tint)"></div></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:4px">--success</div></div><div style="flex:1"><div style="display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line-1)"><div style="flex:1;height:64px;background:var(--info)"></div><div style="flex:1;height:64px;background:var(--info-tint)"></div></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:4px">--info</div></div><div style="flex:1"><div style="display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line-1)"><div style="flex:1;height:64px;background:var(--warning)"></div><div style="flex:1;height:64px;background:var(--warning-tint)"></div></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:4px">--warning</div></div><div style="flex:1"><div style="display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line-1)"><div style="flex:1;height:64px;background:var(--danger)"></div><div style="flex:1;height:64px;background:var(--danger-tint)"></div></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:4px">--danger</div></div></div></body></html>
