<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-body);display:flex;align-items:center;min-height:130px;padding:16px 20px;box-sizing:border-box}.b{font:600 15px var(--font-sans);padding:11px 22px;border-radius:var(--r-md);border:0;color:#fff}</style></head><body><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><button class="b" style="background:var(--navy-700)">Default</button><button class="b" style="background:var(--navy-800)">Hover</button><button class="b" style="background:var(--navy-900);transform:scale(.98)">Press</button><button class="b" style="background:var(--navy-700);box-shadow:var(--ring)">Focus</button><button class="b" style="background:var(--ink-100);color:var(--text-faint)">Disabled</button></div></body></html>
