gn-items:flex-end;padding:6px 8px;box-sizing:border-box;color:#0c1422;font:600 10px var(--font-mono)">gold</div><div style="font:500 10.5px var(--font-mono);color:var(--text-muted);margin-top:4px">--accent-gold</div></div><div style="flex:1;min-width:70px"><div style="background:var(--text-heading);height:64px;border-radius:10px;border:1px solid var(--line-1);display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;color:#0c1422;font:600 10px var(--font-mono)">heading</div><div style="font:500 10.5px var(--font-mono);color:var(--text-muted);margin-top:4px">--text-heading</div></div><div style="flex:1;min-width:70px"><div style="background:var(--text-muted);height:64px;border-radius:10px;border:1px solid var(--line-1);display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;color:#0c1422;font:600 10px var(--font-mono)">muted</div><div style="font:500 10.5px var(--font-mono);color:var(--text-muted);margin-top:4px">--text-muted</div></div></div></body></html>
